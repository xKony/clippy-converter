[package]
name = "clippy-converter"
version = "0.1.0"
edition = "2024"
description = "A lightweight, background unit and currency converter with global hotkeys and local caching"
license = "MIT"
repository = "https://github.com/xKony/clippy-converter"
keywords = ["rust", "clippy", "converter", "cli"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
global-hotkey = "0.7.0"
arboard = "3.4"
enigo = "0.6.1"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redb = "4.1.0"
bincode = "1.3.3"
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
tray-icon = "0.19"
open = "5.3"
single-instance = "0.3.3"
eframe = { version = "0.34.1", features = ["glow"] }
egui = "0.34.1"
egui_extras = { version = "0.34.1", features = ["svg"] }
# Decodes icons/clippy-converter_icon.ico for the tray; already in the tree
# via arboard/eframe, so this adds no new compiled code.
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[dev-dependencies]
tempfile = "3.10"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 16

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
unnecessary_wraps = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
